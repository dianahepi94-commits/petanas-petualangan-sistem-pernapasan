<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PETANAS – Petualangan Sistem Pernapasan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#dff3e4;--card:#fffdf5;--ink:#1c3b2a;--mut:#466654;--p1:#1e7fd6;--p2:#d9482f;--ok:#1f9d55;--bad:#d64545;--acc:#ff9f1c;--line:#b9dcc4;--pole:#8a5a2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2619;--card:#183827;--ink:#eaf6ee;--mut:#a5c4b2;--p1:#5aabf5;--p2:#ff8a70;--ok:#4cc984;--bad:#ff7070;--line:#2c5640;--pole:#b57b45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2619;--card:#183827;--ink:#eaf6ee;--mut:#a5c4b2;--p1:#5aabf5;--p2:#ff8a70;--ok:#4cc984;--bad:#ff7070;--line:#2c5640;--pole:#b57b45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;line-height:1.15;margin:0}
header{padding:16px 14px 4px;text-align:center}
header h1{font-size:2rem;font-weight:800}
header p{margin:2px 0 0;color:var(--mut)}
nav{display:flex;gap:6px;justify-content:center;padding:8px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{font:700 .95rem "Baloo 2",sans-serif;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:6px 12px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.card h3{font-size:1.25rem;margin-bottom:4px}
.card ul{margin:6px 0 0;padding-left:20px}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.path span{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:2px 9px}
.btn{font:800 1.1rem "Baloo 2",sans-serif;border:0;border-radius:14px;padding:9px 20px;background:var(--acc);color:#2a1a00;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.opt{display:block;width:100%;text-align:left;font:700 .95rem Nunito,sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.center{text-align:center}
.big{font:800 2.6rem "Baloo 2",sans-serif}
.tag{font:700 .85rem Nunito;color:var(--mut)}
/* peta level */
.map{display:grid;gap:12px}
.lv{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:12px 14px;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.lv[disabled]{opacity:.55;border-style:dashed;cursor:not-allowed}
.lv .n{font:800 1.8rem "Baloo 2";width:56px;height:56px;border-radius:50%;background:var(--acc);color:#2a1a00;display:grid;place-items:center;flex:none}
.lv b{font:800 1.2rem "Baloo 2"}
/* tarik tambang */
.setup input{font:700 1rem Nunito;padding:8px 10px;border-radius:10px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{border:2px solid var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:700}
.chips input{position:absolute;opacity:0}
.chips label:has(input:checked){background:var(--ink);color:var(--bg)}
.chips label:has(input:focus-visible){outline:3px solid var(--acc)}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{border:3px solid var(--c);border-radius:16px;padding:8px;background:var(--card);min-width:0}
.col h3{color:var(--c);display:flex;justify-content:space-between;font-size:1.05rem}
.qt{font-weight:700;font-size:.95rem;min-height:4.2em;line-height:1.3}
.col .opt{font-size:.85rem;padding:7px 8px;border-color:var(--c)}
.hint{margin:8px 0;text-align:center}
.ropew{position:relative;height:128px;border-radius:14px;overflow:hidden}
.ropew .zl,.ropew .zr{position:absolute;top:0;bottom:0;width:50%}
.ropew .zl{left:0;background:color-mix(in srgb,var(--p1) 22%,transparent)}
.ropew .zr{right:0;background:color-mix(in srgb,var(--p2) 22%,transparent)}
.ropew .mid{position:absolute;left:50%;top:6px;bottom:6px;border-left:3px dashed var(--mut)}
.ropew .rope{position:absolute;left:3%;right:3%;top:74px;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,#c9a14a 0 10px,#8f6a1f 10px 14px)}
.ropew .ln{position:absolute;top:8px;font-size:1.5rem;transform:translateX(-50%)}
.ropew .ln.l{left:20%}.ropew .ln.r{left:80%}
.ropew .flag{position:absolute;top:76px;font-style:normal;font-size:2.2rem;transform:translate(-30%,-95%);transition:left .45s}
.ropew .pl{position:absolute;bottom:4px;font:800 .85rem "Baloo 2",sans-serif}
.ropew .pl.l{left:8px;color:var(--p1)}.ropew .pl.r{right:8px;color:var(--p2)}
@media (min-width:640px){.col .opt{font-size:1rem}.qt{font-size:1.05rem}.ropew{height:128px}}
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));color:#fff;background:linear-gradient(#2f8f4e,#0f3d2a);overflow:auto}
#cover .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#cover>*:not(.scene){position:relative;z-index:1}
#cover .ck{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:6px 0;animation:bob 2.4s ease-in-out infinite}
#cover .ck svg{width:min(34vw,140px);height:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.cpanel{background:rgba(9,48,31,.84);border:3px solid #ffe29a;border-radius:22px;padding:12px 18px;max-width:560px;width:100%}
#cover.hide{display:none}
#cover h2{font:800 clamp(2.6rem,11vw,5rem)/1 "Baloo 2",system-ui,sans-serif;margin:14px 0 0;text-shadow:0 4px 0 rgba(0,0,0,.35);letter-spacing:.01em}
#cover h3{font:800 clamp(1.1rem,4.5vw,1.6rem) "Baloo 2",system-ui,sans-serif;margin:6px 0 0;color:#ffe29a}
#cover p{max-width:34ch;margin:14px 0 22px;font-weight:700;opacity:.95}
#cover .btn{font-size:1.4rem;padding:12px 34px}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kd{position:absolute;bottom:2px;width:76px;height:96px;transition:transform .4s;transform-origin:50% 100%}
.kd.l{left:1%}.kd.r{right:1%}
.kid{width:100%;height:100%;display:block}
.nm{display:flex;align-items:center;gap:6px}
.av{display:inline-block;width:34px;height:42px}
.kids{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:110px;margin:4px 0 8px}
.kids .kid{width:90px;height:110px}.kids b{font-size:2rem;margin-bottom:34px}
.winner{width:130px;height:160px;margin:0 auto;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.mc{--mc:#1e7fd6;border:3px solid var(--mc);background:color-mix(in srgb,var(--mc) 11%,var(--card))}
.mc h3{color:color-mix(in srgb,var(--mc) 72%,var(--ink));display:flex;align-items:center;gap:8px;font-size:1.3rem}
.mc h3 .em{font-size:1.7rem}
.hero2{background:linear-gradient(135deg,#1e7fd6,#7a4fd6 55%,#e0436b);color:#fff;border:0;text-align:center}
.hero2 h3{color:#fff}
.lung{display:block;width:100%;max-width:440px;margin:6px auto;color:var(--ink)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.leg div{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;line-height:1.3}
.leg i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 .8rem "Baloo 2",sans-serif;font-style:normal}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800}
.flow span{color:#fff;border-radius:999px;padding:3px 12px;background:var(--b)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.og div{background:var(--card);border:2px solid var(--b);border-radius:14px;padding:8px 10px;font-size:.9rem;line-height:1.35}
.og b{color:color-mix(in srgb,var(--b) 70%,var(--ink))}.og em{font-style:normal;font-size:1.4rem;display:block}
.mechs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-top:6px}
.mechs svg{width:100%;max-width:170px}
.mechs p{margin:2px 0 0;font-size:.9rem}
@media (min-width:640px){.og{grid-template-columns:repeat(3,1fr)}}
.pic{display:block;width:100%;height:auto;border-radius:14px;margin:8px 0;cursor:zoom-in}
.pic.big{position:fixed;inset:0;z-index:60;width:100%;height:100%;object-fit:contain;background:rgba(0,0,0,.92);padding:8px;margin:0;border-radius:0;cursor:zoom-out}
#cover .cimg{display:block;width:auto;height:auto;max-width:100%;max-height:52vh;margin:10px 0;border-radius:18px;border:4px solid #ffe29a;box-shadow:0 6px 0 rgba(0,0,0,.25)}
</style>
</head>

  if(K.i>=K.qs.length){const ok=K.s>=6,st=K.s>=8?3:K.s>=7?2:ok?1:0;
    if(ok){stars[K.n]=Math.max(stars[K.n],st);if(K.n+1<LV.length)unlocked=Math.max(unlocked,K.n+2)}
    app.innerHTML=`<div class="card center"><div class="big">${'⭐'.repeat(st)||'💪'}</div><h3>${K.s} dari 8 benar</h3><p>${ok?(K.n<2?'Level berikutnya terbuka!':'Kamu menamatkan semua level. Hebat!'):'Belum cukup. Baca materi lagi lalu coba lagi.'}</p>
    <button class="btn" id="a">Ulangi level</button> <button class="btn alt" id="b">Ke peta</button> ${ok&&K.n<2?'<button class="btn" id="c">Level berikutnya</button>':''}</div>`;
    $('#a').onclick=()=>{K={n:K.n,qs:shuf(LV[K.n]),i:0,s:0};kuis()};$('#b').onclick=peta;
    if($('#c'))$('#c').onclick=()=>{const n=K.n+1;K={n,qs:shuf(LV[n]),i:0,s:0};kuis()};return}
  const [q,o,c]=K.qs[K.i];
  app.innerHTML=`<div class="card"><span class="tag">Level ${K.n+1} ${NM[K.n]} · Soal ${K.i+1}/8 · Benar ${K.s}</span><h3 style="margin:6px 0">${q}</h3><div id="o">${o.map((t,j)=>`<button class="opt" data-j="${j}">${L[j]}. ${t}</button>`).join('')}</div><p id="fb"></p></div>`;
  document.querySelectorAll('#o .opt').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;document.querySelectorAll('#o .opt').forEach(x=>x.disabled=true);
    $(`#o [data-j="${c}"]`).classList.add('ok');if(j===c)K.s++;else b.classList.add('bad');
    $('#fb').innerHTML=(j===c?'Benar! ':'Belum tepat. ')+'<button class="btn" id="nx" style="font-size:1rem;padding:5px 16px">Lanjut</button>';
    $('#nx').onclick=()=>{K.i++;kuis()}})}

/* ---- KARTUN ANAK ---- */
function kid(shirt,skin,hair,flip,girl,wave){
  return `<svg class="kid" viewBox="0 0 80 100" aria-hidden="true" ${flip?'style="transform:scaleX(-1)"':''}><ellipse cx="40" cy="96" rx="24" ry="4" fill="rgba(0,0,0,.2)"/>
<rect x="28" y="64" width="10" height="26" rx="5" fill="#33406b"/><rect x="42" y="64" width="10" height="26" rx="5" fill="#33406b"/>
<ellipse cx="33" cy="91" rx="9" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/><ellipse cx="47" cy="91" rx="9" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<path d="M24 47Q40 40 56 47L58 70Q40 76 22 70Z" fill="${shirt}"/>
<path d="${wave?'M55 52Q68 44 72 28M25 52Q14 60 12 72':'M54 52Q68 56 77 50M54 60Q68 64 77 57'}" stroke="${skin}" stroke-width="6" stroke-linecap="round" fill="none"/>
${girl?`<circle cx="15" cy="28" r="7" fill="${hair}"/><circle cx="65" cy="28" r="7" fill="${hair}"/>`:''}
<circle cx="40" cy="27" r="20" fill="${skin}"/>
<path d="M20 25Q20 5 40 6Q60 5 60 25Q50 15 40 17Q30 15 20 25Z" fill="${hair}"/>
<circle cx="33" cy="29" r="4.5" fill="#fff"/><circle cx="47" cy="29" r="4.5" fill="#fff"/><circle cx="34.5" cy="30" r="2.4" fill="#222"/><circle cx="48.5" cy="30" r="2.4" fill="#222"/>
<circle cx="26" cy="37" r="3.6" fill="#ff8fa0" opacity=".75"/><circle cx="54" cy="37" r="3.6" fill="#ff8fa0" opacity=".75"/>
<path d="M34 38Q40 45 46 38Z" fill="#8a2f3a" stroke="#8a2f3a" stroke-width="1.5" stroke-linejoin="round"/></svg>`}
const K1=kid('#1e7fd6','#ffd2a6','#5a3a22',0,1),K2=kid('#d9482f','#e8b48a','#2a1a12',1,0);
/* ---- TARIK TAMBANG 2 PEMAIN ---- */
let names=['Pemain 1','Pemain 2'],lvl='0',G,bUn=1;
const MX=[4,5,6];
function setup(){
  app.innerHTML=`<div class="card setup"><h3>🪢 Battle Tarik Tambang</h3><div class="kids">${K1}<b>🪢</b>${K2}</div>
  <p>Dua pemain, satu HP, <b>main bersamaan</b>. Layar dibagi dua. Jawab soal dengan benar untuk menarik tali ke sisimu (3 benar berturut-turut: tarikan ganda!). Jawaban salah membuat <b>talimu tertarik lawan</b>. Tarik bendera 🚩 sampai garis finis 🏁 di sisimu untuk menang!</p>
  <p><b>Pilih level soal</b></p><div class="chips">${NM.map((n,i)=>`<label ${i>=bUn?'style="opacity:.55"':''}><input type="radio" name="lv" value="${i}" ${+lvl===i?'checked':''} ${i>=bUn?'disabled':''}>${i>=bUn?'🔒 ':''}Level ${i+1}: ${n}</label>`).join('')}</div><p class="tag">Menangkan satu pertandingan untuk membuka level berikutnya. Makin tinggi level, makin panjang tarikannya.</p>
  <p><label>Nama pemain 1 (kiri)<br><input id="n1" value="${names[0]}" maxlength="12" style="border-color:var(--p1)"></label></p>
  <p><label>Nama pemain 2 (kanan)<br><input id="n2" value="${names[1]}" maxlength="12" style="border-color:var(--p2)"></label></p>
  <button class="btn" id="go">Mulai menarik!</button></div>`;
  $('#go').onclick=()=>{names=[$('#n1').value.trim()||'Pemain 1',$('#n2').value.trim()||'Pemain 2'];
    lvl=document.querySelector('[name=lv]:checked').value;
    G={done:0,pos:0,max:MX[+lvl],pool:LV[+lvl],P:[0,1].map(()=>({st:0,lock:0,sel:-1,q:null,qu:[]}))};
    G.P.forEach(p=>nextQ(p));draw()}}
function nextQ(p){if(!p.qu.length)p.qu=shuf(G.pool);p.q=p.qu.pop();p.sel=-1;p.lock=0}
function col(i){const p=G.P[i],[q,o,c]=p.q;
  return `<section class="col" style="--c:var(--p${i+1})"><h3><span class="nm"><span class="av">${i?K2:K1}</span>${names[i]}</span><span>${p.st>1?'🔥'+p.st:''}</span></h3>
  <div class="qt">${q}</div>${o.map((t,j)=>`<button class="opt ${p.sel>=0&&j===c?'ok':''} ${p.sel===j&&j!==c?'bad':''}" data-p="${i}" data-j="${j}" ${p.lock||G.done?'disabled':''}>${L[j]}. ${t}</button>`).join('')}</section>`}
function rope(){const x=G.pos,l=x<0?-10:x>0?8:0,r=x>0?10:x<0?-8:0;
  return `<div class="ropew"><div class="zl"></div><div class="zr"></div><i class="mid"></i><div class="rope"></div><b class="ln l">🏁</b><b class="ln r">🏁</b><i class="flag" style="left:${50+x*(30/G.max)}%">🚩</i><div class="kd l" style="transform:rotate(${l}deg)">${K1}</div><div class="kd r" style="transform:rotate(${r}deg)">${K2}</div></div>`}
function draw(){app.innerHTML=`<div class="card" style="padding:6px;margin-top:6px">${rope()}</div><div class="arena">${col(0)}${col(1)}</div><p class="hint tag">Level ${+lvl+1}: ${NM[+lvl]} · Tarik bendera ${G.max} langkah ke garis finis 🏁 di sisimu</p>`;
  document.querySelectorAll('.col .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.p,+b.dataset.j))}
function pick(i,j){const p=G.P[i];if(G.done||p.lock)return;
  const ok=j===p.q[2],d=i?1:-1;p.lock=1;p.sel=j;
  if(ok){p.st++;G.pos+=d*(p.st%3===0?2:1)}else{p.st=0;G.pos-=d}
  G.pos=Math.max(-G.max,Math.min(G.max,G.pos));
  if(Math.abs(G.pos)>=G.max){G.done=1;draw();return setTimeout(()=>result(G.pos<0?0:1),900)}
  draw();setTimeout(()=>{if(G.done)return;nextQ(p);draw()},ok?650:1000)}
function result(w){const n=+lvl,more=n<2;
  if(more)bUn=Math.max(bUn,n+2);
  app.innerHTML=`<div class="card center"><div class="winner">${w?K2:K1}</div><div class="big">🏆 ${names[w]} menang!</div><p>Level ${n+1} (${NM[n]}) selesai! ${more?'Level '+(n+2)+' ('+NM[n+1]+') sekarang terbuka.':'Kalian menamatkan semua level tarik tambang. Hebat!'}</p><button class="btn alt" id="r">Ulangi level</button> ${more?'<button class="btn" id="nl">Level berikutnya</button> ':''}<button class="btn alt" id="m">Baca materi</button></div>`;
  $('#r').onclick=setup;if(more)$('#nl').onclick=()=>{lvl=String(n+1);setup()};$('#m').onclick=()=>go('materi')}
materi();
$('#cover .cimg').src=COVER;
document.addEventListener('click',e=>{const p=e.target.closest('.pic');if(p)p.classList.toggle('big')});
$('#start').onclick=()=>{$('#cover').classList.add('hide');window.scrollTo(0,0)};
</script>
</body>
</html>
